name: Bootstrap foto site
on: workflow_dispatch

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download foto
        run: |
          mkdir -p /tmp/foto-bin
          curl -sL https://github.com/waynezhang/foto/releases/latest/download/foto_Linux_x86_64.tar.gz \
            | tar xz -C /tmp/foto-bin

      - name: Scaffold
        run: |
          /tmp/foto-bin/foto create _scaffold
          cp -r _scaffold/. .
          rm -rf _scaffold

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add foto.toml assets media templates
          git commit -m "Scaffold foto site"
          git push
